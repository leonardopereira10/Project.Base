name: CI/CD - Build, Test, SonarQube & NuGet Publish

on:
  push:
    branches: ['main']
    tags:
      - 'v*.*.*'
  pull_request:
    branches: ['main']

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: 'Project.Base.sln'
  COVERAGE_THRESHOLD: 80

jobs:
  # ============================================
  # CI - Build, Test & Coverage (Linux)
  # ============================================
  ci-validation:
    runs-on: ubuntu-latest
    name: 'CI: Build, Test & Coverage'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Run Unit Tests
        run: >-
          dotnet test ${{ env.SOLUTION_FILE }}
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
          retention-days: 30

  # ============================================
  # SonarQube + Coverage (Windows - Self-Hosted)
  # ============================================
  sonarqube-analysis:
    runs-on: [self-hosted, windows]
    name: 'SonarQube: Security & Coverage Analysis'
    environment: nuget
    needs: ci-validation
    if: always()
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'http://localhost:9000' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add dotnet tools to PATH
        run: |
          $dotnetToolsPath = Join-Path $env:USERPROFILE ".dotnet\tools"
          echo "$dotnetToolsPath" >> $env:GITHUB_PATH
          $env:PATH = "$dotnetToolsPath;$env:PATH"

      - name: Install SonarScanner CLI
        run: dotnet tool install --global dotnet-sonarscanner
        continue-on-error: true
        
      - name: Update SonarScanner CLI
        run: dotnet tool update --global dotnet-sonarscanner
        continue-on-error: true

      - name: Begin SonarQube Analysis
        run: |
          dotnet-sonarscanner begin ^
            /k:"Project.Base" ^
            /n:"Project.Base" ^
            /d:sonar.host.url="${{ env.SONAR_HOST_URL }}" ^
            /d:sonar.sources="Project.Base.WebApi,Project.Base.Contracts,Project.Base.Domain,Project.Base.Repository" ^
            /d:sonar.tests="Project.Base.Tests" ^
            /d:sonar.token="${{ env.SONAR_TOKEN }}" ^
            /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}/coverage.opencover.xml"
        shell: cmd

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Run Tests with Coverage (OpenCover)
        run: |
          dotnet test ${{ env.SOLUTION_FILE }} `
            --configuration Release `
            --no-build `
            --no-restore `
            /p:CollectCoverage=true `
            /p:CoverletOutputFormat=opencover `
            /p:CoverletOutput=${{ github.workspace }}/coverage.opencover.xml `
            --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sonar
          path: '**/*.trx'
          retention-days: 30

      - name: End SonarQube Analysis
        run: |
          dotnet-sonarscanner end ^
            /d:sonar.token="${{ env.SONAR_TOKEN }}"
        shell: cmd
        
  # ============================================
  # Gate - Coverage Threshold Check (Linux)
  # ============================================
  coverage-gate:
    runs-on: ubuntu-latest
    name: 'Coverage Gate Check'
    needs: ci-validation
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Run Tests with Coverage (Cobertura)
        run: |
          mkdir -p ${{ github.workspace }}/coverage
          
          dotnet test ${{ env.SOLUTION_FILE }} \
            --configuration Release \
            --no-build \
            --no-restore \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=${{ github.workspace }}/coverage/coverage.cobertura.xml

      - name: Debug - Find Coverage File
        run: |
          echo "=== Searching for coverage files ==="
          find ${{ github.workspace }} -name "*.cobertura.xml" -o -name "coverage.cobertura.xml" -o -name "*.cobertura" 2>/dev/null
          
          echo "=== Coverage directory contents ==="
          ls -la ${{ github.workspace }}/coverage/ || echo "Directory not found"

      - name: Check Coverage Threshold
        run: |
          # Try to find the coverage file
          COVERAGE_FILE=$(find ${{ github.workspace }} -name "coverage.cobertura.xml" -type f 2>/dev/null | head -n 1)
          
          if [ -z "$COVERAGE_FILE" ]; then
            echo "File not found with exact name, trying other patterns..."
            COVERAGE_FILE=$(find ${{ github.workspace }} -name "*.cobertura.xml" -type f 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$COVERAGE_FILE" ]; then
            echo "Still not found, trying without .xml extension..."
            COVERAGE_FILE=$(find ${{ github.workspace }} -name "*.cobertura" -type f 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$COVERAGE_FILE" ] || [ ! -f "$COVERAGE_FILE" ]; then
            echo "::error::Coverage file not found!"
            echo "Available XML files:"
            find ${{ github.workspace }} -name "*.xml" -type f 2>/dev/null | grep -i coverage || echo "No coverage files found"
            exit 1
          fi
          
          echo "✅ Found coverage file: $COVERAGE_FILE"

          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "::error::Coverage file not found at $COVERAGE_FILE"
            exit 1
          fi

          echo "=== Coverage Threshold Validation ==="
          echo "Required minimum coverage: ${{ env.COVERAGE_THRESHOLD }}%"
          echo ""

          TOTAL_LINES=$(grep -o 'lines-valid="[0-9]*"' "$COVERAGE_FILE" | grep -o '[0-9]*' | head -1)
          COVERED_LINES=$(grep -o 'lines-covered="[0-9]*"' "$COVERAGE_FILE" | grep -o '[0-9]*' | head -1)

          if [ -z "$TOTAL_LINES" ] || [ "$TOTAL_LINES" -eq 0 ]; then
            echo "::error::No valid coverage data found in XML"
            echo "File contents (first 20 lines):"
            head -20 "$COVERAGE_FILE"
            exit 1
          fi

          if [ -z "$COVERED_LINES" ]; then
            COVERED_LINES=0
          fi

          COVERAGE=$((COVERED_LINES * 100 / TOTAL_LINES))
          
          echo "Total lines: $TOTAL_LINES"
          echo "Covered lines: $COVERED_LINES"
          echo "Coverage: ${COVERAGE}%"
          echo ""

          if [ "$COVERAGE" -ge ${{ env.COVERAGE_THRESHOLD }} ]; then
            echo "✅ Coverage threshold PASSED (≥${{ env.COVERAGE_THRESHOLD }}%)"
            exit 0
          else
            echo "❌ Coverage threshold FAILED (${COVERAGE}% < ${{ env.COVERAGE_THRESHOLD }}%)"
            exit 1
          fi
          
  # ============================================
  # CD - NuGet Publish (Tag Only)
  # ============================================
  publish-nuget:
    runs-on: ubuntu-latest
    name: 'CD: Publish NuGet Packages'
    needs: [ci-validation, coverage-gate, sonarqube-analysis]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: nuget
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Pack NuGet Packages
        run: |
          mkdir -p ./nupkg

          dotnet pack Project.Base.Enumerators/Project.Base.Enumerators.csproj \
            --configuration Release --no-build --output ./nupkg

          dotnet pack Project.Base.Contracts/Project.Base.Contracts.csproj \
            --configuration Release --no-build --output ./nupkg

          dotnet pack Project.Base.Domain/Project.Base.Domain.csproj \
            --configuration Release --no-build --output ./nupkg

          dotnet pack Project.Base.Repository/Project.Base.Repository.csproj \
            --configuration Release --no-build --output ./nupkg

          dotnet pack Project.Base.WebApi/Project.Base.WebApi.csproj \
            --configuration Release --no-build --output ./nupkg

          echo "=== Packed Packages ==="
          ls -lh ./nupkg/

      - name: Validate NuGet Packages
        run: |
          for package in ./nupkg/Project.Base.*.nupkg; do
            echo "Validating: $(basename "$package")"
            dotnet nuget verify "$package"
          done
          echo "✅ All packages validated"

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          for package in ./nupkg/Project.Base.*.nupkg; do
            echo "Pushing: $(basename "$package")"
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key ${{steps.login.outputs.NUGET_API_KEY}}
            echo "✅ Pushed: $(basename "$package")"
          done
          echo "=== All packages published successfully ==="

      - name: Upload NuGet Packages as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkg/
          retention-days: 90
