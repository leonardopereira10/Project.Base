name: Publish NuGet Package

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest
    environment: nuget 
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Project.Base.sln

      - name: Build
        run: dotnet build Project.Base.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Project.Base.sln --configuration Release --no-build --no-restore

      - name: Pack
        run: dotnet pack Project.Base.Repository/Project.Base.Repository.csproj --configuration Release --no-build --output ./nupkg
        
      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Push the package
      - name: NuGet push
        run: dotnet nuget push "./nupkg/Project.Base.*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
     
